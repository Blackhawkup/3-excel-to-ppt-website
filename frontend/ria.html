<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>RIA Automation</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <nav>
        <ul>
            <li><a href="index.html" id="nav-home" class="active">Monthly PPT Generator</a></li>
            <li><a href="ria.html" id="nav-ria">RIA Automation</a></li>
            <li><a href="readyreckoner.html" id="nav-rr">Ready Reckoner</a></li>

        </ul>
    </nav>
    <main>
        <h1>RIA PPT Automation</h1>
        <form class="form-upload" id="ria-form">
            <div class="input-group">
                <label for="ria-ppt">PPT Template (.pptx)</label>
                <input type="file" name="ppt_file" id="ria-ppt" required accept=".pptx">
            </div>
            <div class="input-group">
                <label for="ria-excel1">Excel File 1 (.xlsx)</label>
                <input type="file" name="excel_file1" id="ria-excel1" required accept=".xlsx">
            </div>
            <div class="input-group">
                <label for="ria-excel2">CSV File 2 (.csv)</label>
                <input type="file" name="excel_file2" id="ria-excel2" required accept=".csv">
            </div>
            <div class="input-group">
                <label for="ria-excel3">Excel File 3 (.xlsx)</label>
                <input type="file" name="excel_file3" id="ria-excel3" required accept=".xlsx">
            </div>
            <div class="input-group">
                <label for="owner-no">Owner Number</label>
                <input type="text" name="owner_no" id="owner-no" placeholder="Enter owner number" required>
            </div>
            <button type="submit">Process and Download PPT</button>
            <div class="result-message" id="ria-result"></div>
        </form>
        <div class="instructions" id="instructions-ria">
            Placeholder instructions for RIA process.<br>
            - Placeholder step A<br>
            - Placeholder step B<br>
            (Replace with your own instructions)
        </div>
    </main>
    <script src="main.js"></script>
</body>

</html>
